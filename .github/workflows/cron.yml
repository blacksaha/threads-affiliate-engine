# Drives the automation engine from the cloud.
#
# Why GitHub Actions in addition to the local Hermes cron: the local job only runs
# while this machine is awake. This workflow keeps the scheduler ticking and, more
# importantly, is the only thing that calls /api/cron/analytics on a cadence - the
# analytics endpoint had no automation at all before this file existed, so the AI
# feedback loop never refreshed on its own.
#
# Vercel Cron cannot do this: the project is on the Hobby plan, which only allows
# cron entries that fire once per day (see vercel.json, kept as a safety net).
name: Cron Automation

on:
  schedule:
    - cron: '*/10 * * * *'   # scheduler: publish due posts + recover failed pipelines
    - cron: '15 */2 * * *'   # analytics: sync Threads insights into the feedback loop
  workflow_dispatch:
    inputs:
      endpoint:
        description: Which cron endpoint to call
        type: choice
        required: true
        default: scheduler
        options:
          - scheduler
          - analytics

# Never let two runs overlap: the engine has its own idempotency locks, but a
# queue of overlapping runs would waste minutes and hammer the database.
concurrency:
  group: cron-automation
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Determine which endpoint to call
        id: pick
        env:
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          DISPATCH_INPUT: ${{ github.event.inputs.endpoint }}
        run: |
          # Manual run: honour the chosen input.
          # Scheduled run: the analytics entry is the one at minute 15 past even hours.
          if [ "${DISPATCH_INPUT:-}" = "analytics" ] || [ "${EVENT_SCHEDULE:-}" = "15 */2 * * *" ]; then
            echo "path=api/cron/analytics" >> "$GITHUB_OUTPUT"
          else
            echo "path=api/cron/scheduler" >> "$GITHUB_OUTPUT"
          fi

      - name: Call ${{ steps.pick.outputs.path }}
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          BASE_URL: ${{ vars.CRON_BASE_URL || 'https://threads-affiliate-engine.vercel.app' }}
          PATH_TO_HIT: ${{ steps.pick.outputs.path }}
        run: |
          set -eu
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::CRON_SECRET secret is not set on this repository."
            exit 1
          fi
          url="${BASE_URL}/${PATH_TO_HIT}?secret=${CRON_SECRET}"
          code=$(curl -sS -o /tmp/body.json -w '%{http_code}' --max-time 60 "$url")
          echo "HTTP $code"
          cat /tmp/body.json
          echo
          if [ "$code" != "200" ]; then
            echo "::error::Cron endpoint returned HTTP $code"
            exit 1
          fi
